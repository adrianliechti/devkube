version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

# Homebrew casks support both macOS and Linux.
homebrew_casks:
  - name: devkube
    binaries: [devkube]
    # The publisher adds postflight_steps; GoReleaser's hooks still emit postflight.
    skip_upload: true
    homepage: "https://github.com/adrianliechti/devkube"
    description: "Create and manage local Kubernetes clusters"
    repository:
      owner: adrianliechti
      name: homebrew-tap

    commit_author:
      name: Adrian Liechti
      email: adrian@localhost

publishers:
  - name: homebrew-cask
    # Publish the extra cask file, excluding release archives.
    ids: [homebrew-cask]
    extra_files:
      - glob: dist/homebrew/Casks/devkube.rb
    env:
      - GITHUB_TOKEN={{ .Env.GITHUB_TOKEN }}
    cmd: ./scripts/publish-cask.sh {{ .Version }}

scoops:
  - repository:
      owner: adrianliechti
      name: scoop-bucket

    commit_author:
      name: Adrian Liechti
      email: adrian@localhost
